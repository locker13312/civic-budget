[importlinter]
root_package = civic_budget
include_external_packages = True

[importlinter:contract:r1-layers]
name = R1: модулі залежать лише згори вниз
type = layers
layers =
    civic_budget.web
    civic_budget.results
    civic_budget.voting
    civic_budget.projects
    civic_budget.identity | civic_budget.cycles
    civic_budget.platform

[importlinter:contract:r2-platform]
name = R2: platform лише через пакет
type = protected
protected_modules = civic_budget.platform.*
allowed_importers = civic_budget.platform

[importlinter:contract:r2-identity]
name = R2: identity лише через пакет
type = protected
protected_modules = civic_budget.identity.*
allowed_importers = civic_budget.identity

[importlinter:contract:r2-cycles]
name = R2: cycles лише через пакет
type = protected
protected_modules = civic_budget.cycles.*
allowed_importers = civic_budget.cycles

[importlinter:contract:r2-projects]
name = R2: projects лише через пакет
type = protected
protected_modules = civic_budget.projects.*
allowed_importers = civic_budget.projects

[importlinter:contract:r2-voting]
name = R2: voting лише через пакет
type = protected
protected_modules = civic_budget.voting.*
allowed_importers = civic_budget.voting

[importlinter:contract:r2-results]
name = R2: results лише через пакет
type = protected
protected_modules = civic_budget.results.*
allowed_importers = civic_budget.results

[importlinter:contract:r4-web-only]
name = R4: fastapi лише у web
type = forbidden
source_modules =
    civic_budget.platform
    civic_budget.identity
    civic_budget.cycles
    civic_budget.projects
    civic_budget.voting
    civic_budget.results
forbidden_modules =
    fastapi
    starlette
