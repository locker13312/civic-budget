[project]
name = "civic-budget"
version = "0.1.0"
description = "Громадський бюджет міста: подання проєктів, модерація, голосування, підсумки"
readme = "README.md"
authors = [
    { name = "Литвиненко Ілля", email = "litvinenko7b@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.143.0",
    "pydantic>=2.14",
    "pydantic-settings>=2.15.0",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "deptry>=0.25.1",
    "httpx2>=2.13.1",
    "import-linter>=2.15",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 88
target-version = "py313"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "C4", "N", "PT", "RUF"]
# українські літери в рядках і коментарях не є помилкою
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["civic_budget"]

[tool.mypy]
strict = true
python_version = "3.13"
files = ["src", "tests", "scripts"]
mypy_path = "src"
explicit_package_bases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "smoke: мінімальна перевірка, що застосунок стартує (запускається в pre-commit)",
    "ac(id): тест перевіряє критерій прийняття з spec інкременту",
    "hooks: тести git-хуків у тимчасовому репозиторії (повільні)",
]

# правила меж зі spec.md: R1, R2, R4 (adr/0005)
[tool.importlinter]
root_package = "civic_budget"
include_external_packages = true

[[tool.importlinter.contracts]]
id = "r1-layers"
name = "R1: модулі залежать лише згори вниз"
type = "layers"
layers = [
    "civic_budget.web",
    "civic_budget.results",
    "civic_budget.voting",
    "civic_budget.projects",
    "civic_budget.identity | civic_budget.cycles",
    "civic_budget.platform",
]

[[tool.importlinter.contracts]]
id = "r2-web"
name = "R2: web лише через пакет"
type = "protected"
protected_modules = ["civic_budget.web.*"]
allowed_importers = ["civic_budget.web"]

[[tool.importlinter.contracts]]
id = "r2-results"
name = "R2: results лише через пакет"
type = "protected"
protected_modules = ["civic_budget.results.*"]
allowed_importers = ["civic_budget.results"]

[[tool.importlinter.contracts]]
id = "r2-voting"
name = "R2: voting лише через пакет"
type = "protected"
protected_modules = ["civic_budget.voting.*"]
allowed_importers = ["civic_budget.voting"]

[[tool.importlinter.contracts]]
id = "r2-projects"
name = "R2: projects лише через пакет"
type = "protected"
protected_modules = ["civic_budget.projects.*"]
allowed_importers = ["civic_budget.projects"]

[[tool.importlinter.contracts]]
id = "r2-identity"
name = "R2: identity лише через пакет"
type = "protected"
protected_modules = ["civic_budget.identity.*"]
allowed_importers = ["civic_budget.identity"]

[[tool.importlinter.contracts]]
id = "r2-cycles"
name = "R2: cycles лише через пакет"
type = "protected"
protected_modules = ["civic_budget.cycles.*"]
allowed_importers = ["civic_budget.cycles"]

[[tool.importlinter.contracts]]
id = "r2-platform"
name = "R2: platform лише через пакет"
type = "protected"
protected_modules = ["civic_budget.platform.*"]
allowed_importers = ["civic_budget.platform"]

[[tool.importlinter.contracts]]
id = "r4-web-only"
name = "R4: fastapi лише у web"
type = "forbidden"
source_modules = [
    "civic_budget.results",
    "civic_budget.voting",
    "civic_budget.projects",
    "civic_budget.identity",
    "civic_budget.cycles",
    "civic_budget.platform",
]
forbidden_modules = ["fastapi", "starlette"]

# залежності пакетів: див. standards/code-style.md, розділ «Залежності»
[tool.deptry]
known_first_party = ["civic_budget"]

[tool.deptry.per_rule_ignores]
# uvicorn запускається як програма (make run), а не імпортується
DEP002 = ["uvicorn"]
