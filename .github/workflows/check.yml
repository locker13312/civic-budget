name: check

# хуки можна обійти через --no-verify, тому той самий npm run check іде на кожен PR;
# Windows у матриці, бо студент працює на Windows (Git Bash)
on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: setup
        run: npm ci
      - name: check
        run: npm run --silent check 2>&1 | tee check.log
        shell: bash -o pipefail {0}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: check-report-${{ matrix.os }}
          path: check.log
