name: check

# хуки можна обійти через --no-verify, тому той самий npm run check іде на кожен PR;
# Windows у матриці, бо студент працює на Windows (Git Bash)
on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    # сервіс-контейнери є лише на Linux; порожній image вимикає сервіс на Windows
    services:
      postgres:
        image: ${{ matrix.os == 'ubuntu-latest' && 'postgres:16' || '' }}
        env:
          POSTGRES_USER: civic
          POSTGRES_PASSWORD: civic
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U civic" --health-interval 2s --health-timeout 2s
          --health-retries 15
    env:
      CIVIC_TEST_DATABASE_URL: postgres://civic:civic@127.0.0.1:55432/postgres
      # на Linux тести БД обов'язкові: недоступна БД — помилка, а не пропуск
      CIVIC_REQUIRE_DB: ${{ matrix.os == 'ubuntu-latest' && '1' || '0' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: setup
        run: npm ci
      - name: check
        run: npm run --silent check 2>&1 | tee check.log
        shell: bash -o pipefail {0}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: check-report-${{ matrix.os }}
          path: check.log
