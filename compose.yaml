# локальний PostgreSQL для розробки: порт 55432, щоб не конфліктувати з
# установленим PostgreSQL (5432–5434). Запуск: npm run db:up
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: civic
      POSTGRES_PASSWORD: civic
      POSTGRES_DB: civic_budget
    ports:
      - '127.0.0.1:55432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U civic -d civic_budget']
      interval: 2s
      timeout: 2s
      retries: 15
    volumes:
      - civic-pg:/var/lib/postgresql/data

volumes:
  civic-pg:
